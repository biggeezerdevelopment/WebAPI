name: diag
on: pull_request
permissions:
  contents: read
jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go test -v -count=1 ./internal/diag/ && go test -race -v -count=1 ./internal/diag/
      - run: go test -race -v -count=3 -run 'TestSyslogWriteTimesOut|TestSyslogCloseUnblocksStalledWrite' ./output/
