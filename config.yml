webapi:
    -
      enabled: False
      name: "qualys"
      subject: "QualysAPI"
      endpoint: "http://localhost:8080/api/v1/metrics"
      method: "post"
      headers:
        - 
            key: "Content-Type"
            value: "application/json"
          
      auth_type: "apikey"
      api_key: "1234567890"
      #api_username: "admin"
      #api_password: "password"
      # Or read the basic-auth password (e.g. an API token) from the
      # environment instead of committing it; do not set both:
      #api_password_env: "JIRA_API_TOKEN"
      skip_verify: True
      sleeptime: 30
      timeout: 30
      params:
        metrics: "20"
      body:
        - "metrics"

# Periodic liveness record for a SIEM. See README "Heartbeat".
heartbeat:
    enabled: false
    interval: 300               # seconds, 30-3600
    name: "heartbeat"           # record Source field
    outputs: ["siem-webhook"]   # required when enabled
