webapi:
    - 
      enabled: False
      name: "qualys"
      subject: "QualysAPI"
      endpoint: "http://localhost:8080/api/v1/metrics"
      method: "post"
      headers:
        - 
            key: "Content-Type"
            value: "application/json"
          
      auth_type: "apikey"
      api_key: "1234567890"
      #api_username: "admin"
      #api_password: "password"
      skip_verify: True
      sleeptime: 30
      timeout: 30
      params:
        metrics: "20"
      body:
        - "metrics"